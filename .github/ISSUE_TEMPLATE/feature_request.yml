name: Feature request
description: Suggest an idea or improvement for OSS Radar
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Great — many roadmap items came from contributors.
        Please keep **[OSS Radar]** at the start of the issue title.
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what is missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to contribute
      description: This project exists to help people make their first open-source contribution!
      options:
        - label: I would like to implement this feature myself (with guidance)
