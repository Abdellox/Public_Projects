name: AlgoAtlas CI

# CI for the AlgoAtlas project (see ./AlgoAtlas).
# Scoped to the AlgoAtlas folder only — it never touches other projects.

on:
  push:
    branches: [main]
    paths:
      - "AlgoAtlas/**"
  pull_request:
    branches: [main]
    paths:
      - "AlgoAtlas/**"

defaults:
  run:
    working-directory: AlgoAtlas

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AlgoAtlas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
