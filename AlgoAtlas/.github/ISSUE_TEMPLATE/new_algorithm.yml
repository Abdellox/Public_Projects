**Algorithm**
Name of the algorithm and its category, e.g. "Counting Sort (sorting)".

**Short description**
A one- or two-sentence summary of what it does.

**Sections you'll include**
Check what you plan to add:
- [ ] What problem it solves
- [ ] How it works / intuition
- [ ] Step-by-step example
- [ ] Pseudocode
- [ ] Python implementation
- [ ] JavaScript/TypeScript implementation
- [ ] Complexity analysis

**Visualization**
Will you add an interactive visualization? If so, briefly describe how it should
animate (comparisons, swaps, visited nodes, etc.).

**Practice problems**
List any (external) practice platforms you'll reference (e.g. LeetCode links).
