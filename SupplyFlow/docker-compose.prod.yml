# Production compose — expects a pre-built image and strong secrets.
# Usage:
#   docker build -t supplyflow/web:latest .
#   AUTH_SECRET=$(openssl rand -hex 32) POSTGRES_PASSWORD=$(openssl rand -hex 16) docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm migrate   # apply schema

services:
  db:
    image: postgres:16-alpine
    restart: always
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-supplyflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplyflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Expose only if you need external DB access; prefer keeping it internal.
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "everysec"]
    volumes:
      - redisdata:/data

  migrate:
    image: ${WEB_IMAGE:-supplyflow/web:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supplyflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supplyflow}
    command: ["npm", "run", "db:migrate"]

  web:
    image: ${WEB_IMAGE:-supplyflow/web:latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-supplyflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-supplyflow}
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
  redisdata:
