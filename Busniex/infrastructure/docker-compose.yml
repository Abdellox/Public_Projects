services:
  db:
    image: postgres:16-alpine
    container_name: businex-db
    environment:
      POSTGRES_USER: businex
      POSTGRES_PASSWORD: businex
      POSTGRES_DB: businex
    ports:
      - '5432:5432'
    volumes:
      - businex_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: businex-redis
    ports:
      - '6379:6379'

volumes:
  businex_pgdata:
