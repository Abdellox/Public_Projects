version: "3.8"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - AUTH_SECRET=${AUTH_SECRET:-super-secret-key-change-me}
      - AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    restart: unless-stopped
