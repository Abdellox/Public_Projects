name: CI

on:
  push:
    branches: [main]
    paths:
      - "FootLink/**"
  pull_request:
    branches: [main]
    paths:
      - "FootLink/**"

jobs:
  analyze-and-test:
    name: Analyze & test (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FootLink
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
