name: Bug report
description: Report a problem or unexpected behaviour in FootLink
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: FootLink / Flutter version
      description: "e.g. v1.0.0, Flutter 3.38"
      placeholder: "v1.0.0 / Flutter 3.38"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug. What did you expect to happen?
      placeholder: "Tell us what went wrong…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Tap …\n3. See error"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any error output or attach screenshots.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for existing issues about this
          required: true
        - label: I can reproduce this on the latest `main`
