<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="120" height="120">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#0D1B2A"/>
  <!-- Soccer ball -->
  <circle cx="256" cy="232" r="120" fill="#FFFFFF"/>
  <!-- Ball pentagon pattern -->
  <polygon points="256,152 312,187 312,277 200,277 200,187" fill="#0D1B2A" fill-opacity="0.12"/>
  <!-- Accent swoosh -->
  <path d="M150 300 Q256 380 362 300" stroke="#21D07A" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Small accent dot -->
  <circle cx="256" cy="120" r="12" fill="#21D07A"/>
  <!-- Text "FOOTLINK" -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" letter-spacing="4">FOOTLINK</text>
</svg>
